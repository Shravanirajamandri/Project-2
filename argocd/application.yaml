apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: banking
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/REPLACE_ME/banking-gitops.git
    targetRevision: main
    path: helm/banking
  destination:
    server: https://kubernetes.default.svc
    namespace: banking
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
