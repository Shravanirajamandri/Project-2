services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: banking
      POSTGRES_USER: banking_user
      POSTGRES_PASSWORD: banking_pass
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U banking_user -d banking"]
      interval: 5s
      timeout: 5s
      retries: 10


  customer-service:
    build: ./services/customer-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/banking
      DB_USERNAME: banking_user
      DB_PASSWORD: banking_pass
    ports: ["8081:8080"]
    depends_on:
      postgres:
        condition: service_healthy

  account-service:
    build: ./services/account-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/banking
      DB_USERNAME: banking_user
      DB_PASSWORD: banking_pass
    ports: ["8082:8080"]
    depends_on:
      postgres:
        condition: service_healthy

  transaction-service:
    build: ./services/transaction-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/banking
      DB_USERNAME: banking_user
      DB_PASSWORD: banking_pass
    ports: ["8083:8080"]
    depends_on:
      postgres:
        condition: service_healthy

  payment-service:
    build: ./services/payment-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/banking
      DB_USERNAME: banking_user
      DB_PASSWORD: banking_pass
    ports: ["8084:8080"]
    depends_on:
      postgres:
        condition: service_healthy

  loan-service:
    build: ./services/loan-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/banking
      DB_USERNAME: banking_user
      DB_PASSWORD: banking_pass
    ports: ["8085:8080"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
