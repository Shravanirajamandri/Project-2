apiVersion: batch/v1
kind: CronJob
metadata:
  name: banking-eod
  namespace: banking
spec:
  schedule: "0 23 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: eod
            image: busybox:1.36
            command:
            - sh
            - -c
            - |
              echo "EOD batch started"
              echo "Validate transactions"
              echo "Reconcile balances"
              echo "Generate report"
              echo "EOD batch completed"
