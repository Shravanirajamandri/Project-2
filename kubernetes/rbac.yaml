apiVersion: v1
kind: ServiceAccount
metadata:
  name: banking-app
  namespace: banking
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: banking-read-config
  namespace: banking
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get","list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: banking-read-config
  namespace: banking
subjects:
- kind: ServiceAccount
  name: banking-app
  namespace: banking
roleRef:
  kind: Role
  name: banking-read-config
  apiGroup: rbac.authorization.k8s.io
